    <title>To Be, or Not to Be</title>

    <style>

      }

      body {
        height: 100%;

      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;

        font-family: "Karmina", serif;
        font-size: clamp(2.5rem, 4vw, 2rem);

      }

  </head>

  <body>
    <!-- https://www.poetryfoundation.org/poems/56965/speech-to-be-or-not-to-be-that-is-the-question -->
